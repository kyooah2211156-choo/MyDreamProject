<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>댕답개 배우개 - 디자인 시안 5개</title>
<style>
  :root{
    --brown:#4a2418; --coral:#ff7a7a; --pink:#ffd0cc; --cream:#fdf9f3;
    --green:#8dc63f; --leaf:#5e9a1f; --edge:#b87333; --yellow:#ffb81c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f1ebe2;color:var(--brown);padding:32px 16px 64px}
  header.top{max-width:900px;margin:0 auto 32px;text-align:center}
  header.top h1{font-size:34px;font-weight:900}
  header.top h1 b{color:var(--coral)}
  header.top p{margin-top:8px;color:#7a5a4c}
  .names{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .names span{background:#fff;border:2px solid var(--edge);border-radius:999px;padding:8px 16px;font-weight:800}
  .names span.main{background:var(--coral);border-color:var(--coral);color:#fff}
  .grid{display:flex;flex-wrap:wrap;gap:40px;justify-content:center}
  figure{width:300px}
  figcaption{text-align:center;margin-top:14px;font-weight:800}
  figcaption small{display:block;font-weight:500;color:#7a5a4c;margin-top:2px}
  .phone{width:300px;height:620px;border-radius:38px;border:8px solid #2b1a14;overflow:hidden;position:relative;box-shadow:0 14px 30px rgba(74,36,24,.25);display:flex;flex-direction:column}
  .scroll{flex:1;overflow:hidden;padding:14px}
  .status{height:22px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;padding:6px 18px 0}
  .paw{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
  .btn{border:0;border-radius:14px;font-weight:800;font-size:14px;padding:11px 0;flex:1;font-family:inherit}
  .row{display:flex;gap:8px}
  .card{border-radius:18px;padding:12px;margin-bottom:10px}
  .dog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
  .dog b{display:block;font-size:16px}
  .dog small{font-size:11px;opacity:.7}
  h3{font-size:13px;margin:6px 2px 8px}
  .tabs{display:flex;justify-content:space-around;padding:8px 0 14px;font-size:10px;font-weight:700}
  .tabs div{text-align:center}
  .tabs i{display:block;font-style:normal;font-size:18px}

  /* 1. 간판 그대로 */
  .d1{background:var(--cream)}
  .d1 .banner{margin:6px 10px 0;border:3px solid var(--edge);border-radius:28px 28px 28px 28px/36px;background:#fff;text-align:center;padding:10px 8px 8px}
  .d1 .banner h2{font-size:24px;font-weight:900}
  .d1 .banner h2 em{font-style:normal;color:var(--coral)}
  .d1 .banner p{display:inline-block;border:1.5px solid var(--brown);border-radius:999px;padding:2px 10px;font-size:10px;font-weight:700;margin-top:4px}
  .d1 .count{background:var(--pink);text-align:center}
  .d1 .count strong{font-size:34px;color:var(--brown)}
  .d1 .card{background:#fff;border:2px solid #f0e3d3}
  .d1 .av{background:var(--pink)}
  .d1 .go{background:var(--coral);color:#fff}
  .d1 .sub{background:#fff;color:var(--brown);border:2px solid var(--edge)}

  /* 2. 초원 */
  .d2{background:linear-gradient(#e9f6cf,#fdf9f3 40%)}
  .d2 .hero{background:var(--green);color:#fff;padding:14px 16px 26px;border-radius:0 0 50% 50%/0 0 26px 26px;text-align:center;position:relative}
  .d2 .hero h2{font-size:22px;font-weight:900;text-shadow:0 2px 0 var(--leaf)}
  .d2 .hero .tree{font-size:30px}
  .d2 .count{background:#fff;border:3px solid var(--green);text-align:center;margin-top:-18px;position:relative}
  .d2 .count strong{font-size:32px;color:var(--leaf)}
  .d2 .card{background:#fff;border:2px solid #d9ecb5}
  .d2 .av{background:#e9f6cf}
  .d2 .go{background:var(--leaf);color:#fff}
  .d2 .sub{background:#e9f6cf;color:var(--leaf)}

  /* 3. 코랄 팝 */
  .d3{background:var(--coral)}
  .d3 .top{color:#fff;padding:8px 18px 4px}
  .d3 .top h2{font-size:24px;font-weight:900}
  .d3 .sheet{background:var(--cream);border-radius:28px 28px 0 0;padding:14px;flex:1;margin-top:8px}
  .d3 .count{background:var(--brown);color:#fff;display:flex;justify-content:space-between;align-items:center}
  .d3 .count strong{font-size:34px;color:var(--yellow)}
  .d3 .card{background:#fff;box-shadow:0 3px 0 var(--pink)}
  .d3 .av{background:var(--pink)}
  .d3 .go{background:var(--coral);color:#fff;box-shadow:0 3px 0 #e05e5e}
  .d3 .sub{background:var(--pink);color:var(--brown)}

  /* 4. 다크 브라운 */
  .d4{background:var(--brown);color:var(--cream)}
  .d4 h2{font-size:22px;font-weight:900;padding:8px 6px}
  .d4 h2 em{font-style:normal;color:var(--coral)}
  .d4 .count{background:#62362a;display:flex;justify-content:space-between;align-items:center}
  .d4 .count strong{font-size:34px;color:var(--yellow)}
  .d4 .card{background:#5a2f23}
  .d4 .av{background:#7a4a3a}
  .d4 .go{background:var(--yellow);color:var(--brown)}
  .d4 .sub{background:transparent;color:var(--cream);border:2px solid #9a6a58}
  .d4 .tabs{background:#3b1b12}

  /* 5. 미니멀 */
  .d5{background:#fff}
  .d5 h2{font-size:20px;font-weight:900;padding:8px 4px 2px}
  .d5 .date{font-size:11px;color:#9a8478;padding:0 4px 10px}
  .d5 .stats{display:flex;gap:8px;margin-bottom:12px}
  .d5 .stats div{flex:1;border:1.5px solid #eadfd5;border-radius:14px;padding:10px;text-align:center}
  .d5 .stats strong{display:block;font-size:24px}
  .d5 .stats small{font-size:10px;color:#9a8478}
  .d5 .stats .hi strong{color:var(--coral)}
  .d5 .card{border:1.5px solid #eadfd5;border-radius:14px}
  .d5 .av{background:#faf3ec}
  .d5 .go{background:var(--brown);color:#fff}
  .d5 .sub{background:#faf3ec;color:var(--brown)}
  .d5 .tabs{border-top:1.5px solid #eadfd5}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="paw" viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="5" cy="11" rx="2.2" ry="2.8"/><ellipse cx="9.5" cy="6" rx="2.2" ry="3"/><ellipse cx="14.5" cy="6" rx="2.2" ry="3"/><ellipse cx="19" cy="11" rx="2.2" ry="2.8"/><path d="M12 11c-3.5 0-6 3-6 5.5 0 2 1.7 3 3.3 3 1.2 0 1.8-.5 2.7-.5s1.5.5 2.7.5c1.6 0 3.3-1 3.3-3C18 14 15.5 11 12 11z"/></g></symbol>
</svg>

<header class="top">
  <h1>댕답개 <b>배우개</b></h1>
  <p>간판의 갈색 글씨, 코랄 핑크 포인트, 연두 잔디, 발바닥 모양을 이어받은 앱 시안입니다. (선생님 첫 화면)</p>
  <div class="names">
    <span class="main">추천 앱 이름: 댕답개 배우개</span>
    <span>후보: 댕답개 알림장</span>
    <span>후보: 댕답개 유치원</span>
    <span>후보: 배우개 노트</span>
  </div>
</header>

<main class="grid" id="grid"></main>

<script>
const paw = (c='currentColor') => `<svg class="paw" style="color:${c}"><use href="#paw"/></svg>`;
const dogs = [
  {n:'보리', b:'말티즈', t:'08:40 등원', e:'🐶'},
  {n:'초코', b:'푸들', t:'09:05 등원', e:'🐩'},
];
const wait = [{n:'콩이', b:'포메라니안', e:'🦊'}];

const presentCards = () => dogs.map(d => `
  <div class="card">
    <div class="dog"><div class="av">${d.e}</div><div><b>${d.n}</b><small>${d.b} · ${d.t}</small></div></div>
    <div class="row"><button class="btn sub">✏️ 알림장 작성</button><button class="btn go">하원</button></div>
  </div>`).join('');
const waitCards = () => wait.map(d => `
  <div class="card"><div class="dog" style="margin:0"><div class="av">${d.e}</div><div style="flex:1"><b>${d.n}</b><small>${d.b}</small></div><button class="btn go" style="flex:none;padding:10px 18px">등원</button></div></div>`).join('');
const status = (c='inherit') => `<div class="status" style="color:${c}"><span>9:41</span><span>● ● ▮</span></div>`;
const tabs = () => `<div class="tabs"><div><i>🏠</i>홈</div><div><i>📒</i>알림장</div><div><i>📢</i>공지</div><div><i>🐕</i>강아지</div></div>`;

const designs = [
 { cls:'d1', title:'1. 간판 그대로', sub:'크림 바탕 + 구름 테두리 + 코랄 버튼',
   html:`${status()}<div class="banner"><h2>${paw('#f4a0a0')} 댕답개 배우<em>개</em> ${paw('#f4a0a0')}</h2><p>• 댕댕이 유치원 •</p></div>
   <div class="scroll"><div class="card count"><div style="font-size:12px;font-weight:800">오늘 등원 예정</div><strong>3</strong>마리</div>
   <h3>현재 등원한 강아지 ${dogs.length}</h3>${presentCards()}<h3>등원 대기</h3>${waitCards()}</div>${tabs()}` },
 { cls:'d2', title:'2. 초원 놀이터', sub:'연두 언덕 + 나무 + 둥근 카드',
   html:`${status('#fff').replace('class="status"','class="status" style="background:var(--green)"')}<div class="hero"><div class="tree">🌳</div><h2>댕댕이 유치원</h2></div>
   <div class="scroll" style="padding-top:0"><div class="card count"><div style="font-size:12px;font-weight:800">오늘 등원 예정</div><strong>3</strong>마리</div>
   <h3>🌼 현재 등원한 강아지 ${dogs.length}</h3>${presentCards()}<h3>등원 대기</h3>${waitCards()}</div>${tabs()}` },
 { cls:'d3', title:'3. 코랄 팝', sub:'큼직한 코랄 헤더 + 입체 버튼',
   html:`${status('#fff')}<div class="top"><div style="font-size:11px;font-weight:700;opacity:.9">안녕하세요, 선생님 ${paw('#fff')}</div><h2>댕댕이 유치원</h2></div>
   <div class="sheet"><div class="card count"><div style="font-size:12px;font-weight:800">오늘 등원 예정</div><div><strong>3</strong> 마리</div></div>
   <h3>현재 등원한 강아지 ${dogs.length}</h3>${presentCards()}<h3>등원 대기</h3>${waitCards()}</div>${tabs()}` },
 { cls:'d4', title:'4. 초코 브라운 (다크)', sub:'어두운 갈색 + 노랑 포인트',
   html:`${status()}<div class="scroll"><h2>${paw('#ff7a7a')} 댕댕이 <em>유치원</em></h2>
   <div class="card count"><div style="font-size:12px;font-weight:800">오늘 등원 예정</div><div><strong>3</strong> 마리</div></div>
   <h3>현재 등원한 강아지 ${dogs.length}</h3>${presentCards()}<h3>등원 대기</h3>${waitCards()}</div>${tabs()}` },
 { cls:'d5', title:'5. 깔끔 미니멀', sub:'흰 바탕 + 얇은 선 + 숫자 요약',
   html:`${status()}<div class="scroll"><h2>댕댕이 유치원</h2><div class="date">6월 12일 목요일</div>
   <div class="stats"><div><strong>3</strong><small>등원 예정</small></div><div class="hi"><strong>2</strong><small>등원 중</small></div><div><strong>1</strong><small>대기</small></div></div>
   <h3>현재 등원한 강아지</h3>${presentCards()}<h3>등원 대기</h3>${waitCards()}</div>${tabs()}` },
];

document.getElementById('grid').innerHTML = designs.map(d => `
  <figure><div class="phone ${d.cls}">${d.html}</div>
  <figcaption>${d.title}<small>${d.sub}</small></figcaption></figure>`).join('');
</script>
</body>
</html>
