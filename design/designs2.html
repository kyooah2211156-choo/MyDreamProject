<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>댕답개 배우개 - 귀여운 그라데이션 시안 5개</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--page:#fbf3ea;--page-text:#4a2418;--page-sub:#8a6a5c;--chip:#fff}
  body[data-theme=dark]{--page:#150e0c;--page-text:#ffeee6;--page-sub:#b89a8c;--chip:#2a1b17}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--page);color:var(--page-text);padding:28px 16px 64px;transition:.3s}
  header.top{max-width:900px;margin:0 auto 30px;text-align:center}
  header.top h1{font-size:36px;font-weight:900}
  header.top h1 b{background:linear-gradient(90deg,#ff7a7a,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
  header.top p{margin-top:8px;color:var(--page-sub)}
  .toggle{margin-top:16px;display:inline-flex;background:var(--chip);border-radius:999px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .toggle button{border:0;background:transparent;color:var(--page-text);font:800 14px inherit;font-family:inherit;padding:9px 20px;border-radius:999px;cursor:pointer}
  .toggle button.on{background:linear-gradient(135deg,#ff7a7a,#ffb347);color:#fff}
  .grid{display:flex;flex-wrap:wrap;gap:44px;justify-content:center}
  figure{width:300px}
  figcaption{text-align:center;margin-top:14px;font-weight:800}
  figcaption small{display:block;font-weight:500;color:var(--page-sub);margin-top:2px}

  /* ===== 공통 화면 구조 (색은 변수로) ===== */
  .phone{width:300px;height:640px;border-radius:40px;border:8px solid #2b1a14;overflow:hidden;position:relative;display:flex;flex-direction:column;
    background:var(--bg);color:var(--text);box-shadow:0 16px 34px rgba(0,0,0,.28)}
  body[data-theme=dark] .phone{border-color:#3d2b25}
  .status{height:24px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;padding:7px 20px 0;color:var(--hero-text);position:relative;z-index:2}
  .hero{background:var(--hero);color:var(--hero-text);padding:6px 16px 34px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.18)}
  .hero::before{width:120px;height:120px;right:-30px;top:-34px}
  .hero::after{width:70px;height:70px;left:-20px;bottom:-20px}
  .hero .hi{font-size:11px;font-weight:700;opacity:.9;position:relative}
  .hero h2{font-size:23px;font-weight:900;position:relative;display:flex;align-items:center;gap:6px}
  .hero .tag{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.28);position:relative}
  .hero .mascot{position:absolute;right:12px;bottom:6px;font-size:44px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12));animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
  .body{flex:1;padding:0 14px;margin-top:-22px;position:relative;overflow:hidden}
  .count{background:var(--card);border-radius:22px;padding:12px 14px;box-shadow:0 8px 18px var(--shadow);display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .count .num{font-size:38px;font-weight:900;line-height:1;background:var(--btn);-webkit-background-clip:text;background-clip:text;color:transparent}
  .count .lab{font-size:11px;color:var(--sub);font-weight:700}
  .count .lab b{display:block;font-size:14px;color:var(--text)}
  .bar{height:7px;border-radius:99px;background:var(--track);margin-top:6px;overflow:hidden;width:120px}
  .bar i{display:block;height:100%;width:66%;background:var(--btn);border-radius:99px}
  h3{font-size:12px;font-weight:800;margin:8px 4px 6px;color:var(--text)}
  h3 span{color:var(--sub);font-weight:700}
  .card{background:var(--card);border-radius:22px;padding:10px 12px;margin-bottom:9px;box-shadow:0 5px 12px var(--shadow)}
  .dog{display:flex;align-items:center;gap:10px}
  .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--av);flex:none}
  .dog b{display:block;font-size:16px}
  .dog small{font-size:11px;color:var(--sub)}
  .dog .grow{flex:1}
  .row{display:flex;gap:8px;margin-top:9px}
  .btn{flex:1;border:0;border-radius:15px;padding:11px 0;font:800 13px inherit;font-family:inherit;cursor:pointer;transition:transform .15s}
  .btn:hover{transform:scale(1.04) rotate(-1deg)}
  .btn.go{background:var(--btn);color:var(--btn-text);box-shadow:0 4px 0 var(--btn-shadow)}
  .btn.sub{background:var(--btn2);color:var(--btn2-text)}
  .btn.small{flex:none;padding:10px 20px}
  .tabs{margin:0 14px 12px;border-radius:24px;background:var(--card);box-shadow:0 6px 16px var(--shadow);display:flex;justify-content:space-around;padding:7px 0;font-size:10px;font-weight:800;color:var(--sub)}
  .tabs div{text-align:center}.tabs i{display:block;font-style:normal;font-size:18px}
  .tabs .on{color:var(--accent)}

  /* ===== 1. 딸기우유 (간판 코랄) ===== */
  .t1{--bg:linear-gradient(180deg,#fff4ef,#ffe3df);--text:#4a2418;--sub:#a47c6e;--card:#fff;--shadow:rgba(255,122,122,.22);--track:#ffe0dc;--av:linear-gradient(135deg,#ffd0cc,#ffe9d6);
    --hero:linear-gradient(135deg,#ff7a7a,#ffa27a 60%,#ffc58a);--hero-text:#fff;--btn:linear-gradient(135deg,#ff7a7a,#ff9f7a);--btn-text:#fff;--btn-shadow:#e45f5f;--btn2:#ffe3df;--btn2-text:#c9504f;--accent:#ff6b6b}
  body[data-theme=dark] .t1{--bg:linear-gradient(180deg,#2a1716,#1c0f0f);--text:#ffeee6;--sub:#c9a396;--card:#3a2220;--shadow:rgba(0,0,0,.4);--track:#52302d;--av:linear-gradient(135deg,#6a3532,#52302d);
    --hero:linear-gradient(135deg,#c24c4c,#d97652 60%,#e0a063);--btn:linear-gradient(135deg,#ff8585,#ffa58a);--btn-text:#3a1210;--btn-shadow:#b04a4a;--btn2:#52302d;--btn2-text:#ffb3ad}

  /* ===== 2. 새싹 초원 (간판 연두) ===== */
  .t2{--bg:linear-gradient(180deg,#f3fbe3,#e1f4bd);--text:#2f4a14;--sub:#6f8a4c;--card:#fff;--shadow:rgba(110,170,40,.25);--track:#dcefbb;--av:linear-gradient(135deg,#d7f0a6,#f6ffd9);
    --hero:linear-gradient(135deg,#6fbf2c,#9bd94a 55%,#d4ec5a);--hero-text:#fff;--btn:linear-gradient(135deg,#5aa91f,#8cd13f);--btn-text:#fff;--btn-shadow:#437f13;--btn2:#e7f6c9;--btn2-text:#4a7d17;--accent:#5aa91f}
  body[data-theme=dark] .t2{--bg:linear-gradient(180deg,#14200c,#0d1608);--text:#eaf7d4;--sub:#a3bd80;--card:#223316;--shadow:rgba(0,0,0,.4);--track:#33491f;--av:linear-gradient(135deg,#3d5a24,#2e4419);
    --hero:linear-gradient(135deg,#3f7a17,#5e9f26 55%,#8aa92f);--btn:linear-gradient(135deg,#8cd13f,#b6e35a);--btn-text:#16260a;--btn-shadow:#5f8f26;--btn2:#33491f;--btn2-text:#c3e68a}

  /* ===== 3. 노을 복숭아 ===== */
  .t3{--bg:linear-gradient(180deg,#fff6e9,#ffe6cf);--text:#5a2c14;--sub:#a98163;--card:#fff;--shadow:rgba(255,160,70,.25);--track:#ffe3c4;--av:linear-gradient(135deg,#ffd9a8,#ffeacc);
    --hero:linear-gradient(135deg,#ffb347,#ff8a65 55%,#ff6f91);--hero-text:#fff;--btn:linear-gradient(135deg,#ff9a3c,#ff6f91);--btn-text:#fff;--btn-shadow:#d9577a;--btn2:#ffe8cf;--btn2-text:#b9611c;--accent:#ff8a4c}
  body[data-theme=dark] .t3{--bg:linear-gradient(180deg,#2b1a0e,#1d110a);--text:#ffefdc;--sub:#c9a98a;--card:#3b2517;--shadow:rgba(0,0,0,.4);--track:#53341f;--av:linear-gradient(135deg,#6b4527,#53341f);
    --hero:linear-gradient(135deg,#b97a20,#c2573a 55%,#b53b62);--btn:linear-gradient(135deg,#ffae5c,#ff7fa0);--btn-text:#3a1a0a;--btn-shadow:#b45a73;--btn2:#53341f;--btn2-text:#ffc790}

  /* ===== 4. 몽글 라벤더 ===== */
  .t4{--bg:linear-gradient(180deg,#f7f1ff,#ecdfff);--text:#3e2a5c;--sub:#8c79a8;--card:#fff;--shadow:rgba(150,110,230,.22);--track:#e6d9fb;--av:linear-gradient(135deg,#e2d1ff,#fbe3f2);
    --hero:linear-gradient(135deg,#a77bff,#c58bff 55%,#ff9ad0);--hero-text:#fff;--btn:linear-gradient(135deg,#9a6cf5,#ff8cc6);--btn-text:#fff;--btn-shadow:#7a50cf;--btn2:#efe4ff;--btn2-text:#7a4fd0;--accent:#9a6cf5}
  body[data-theme=dark] .t4{--bg:linear-gradient(180deg,#1d1530,#130d21);--text:#f1e8ff;--sub:#b3a2cf;--card:#2b2145;--shadow:rgba(0,0,0,.45);--track:#41336a;--av:linear-gradient(135deg,#4a3a7a,#3b2d62);
    --hero:linear-gradient(135deg,#6a45c9,#8a52c9 55%,#b9548f);--btn:linear-gradient(135deg,#b794ff,#ff9ed0);--btn-text:#241540;--btn-shadow:#7f60c4;--btn2:#41336a;--btn2-text:#d7c3ff}

  /* ===== 5. 하늘 구름 ===== */
  .t5{--bg:linear-gradient(180deg,#eefaff,#d9f1fb);--text:#173a52;--sub:#6a8fa6;--card:#fff;--shadow:rgba(60,160,220,.22);--track:#cfe9f6;--av:linear-gradient(135deg,#c7e9fb,#e5fbf1);
    --hero:linear-gradient(135deg,#4cb8f0,#6fd0e8 55%,#9ae8c8);--hero-text:#fff;--btn:linear-gradient(135deg,#3aa8e8,#5fd6b8);--btn-text:#fff;--btn-shadow:#2682b3;--btn2:#e0f3fc;--btn2-text:#237aa8;--accent:#3aa8e8}
  body[data-theme=dark] .t5{--bg:linear-gradient(180deg,#0e1d28,#09131b);--text:#e4f5ff;--sub:#8fb2c7;--card:#183040;--shadow:rgba(0,0,0,.45);--track:#244a60;--av:linear-gradient(135deg,#2a5670,#1f4358);
    --hero:linear-gradient(135deg,#24739c,#2f93ab 55%,#3f9f86);--btn:linear-gradient(135deg,#6cc9ff,#7fe6c8);--btn-text:#08222f;--btn-shadow:#3c8aad;--btn2:#244a60;--btn2-text:#a8e0ff}
</style>
</head>
<body data-theme="light">
<header class="top">
  <h1>댕답개 <b>배우개</b> 🐾</h1>
  <p>귀여운 그라데이션 시안 5개 · 아래 버튼으로 라이트/다크 모드를 바꿔 보세요</p>
  <div class="toggle" id="toggle">
    <button data-mode="light" class="on">☀️ 라이트</button>
    <button data-mode="dark">🌙 다크</button>
  </div>
</header>
<main class="grid" id="grid"></main>

<script>
const present = [
  {n:'보리', b:'말티즈', t:'08:40 등원', e:'🐶'},
  {n:'초코', b:'푸들', t:'09:05 등원', e:'🐩'},
];
const wait = [{n:'콩이', b:'포메라니안', e:'🦊'}];

const screen = (mascot) => `
  <div class="status"><span>9:41</span><span>● ● ▮</span></div>
  <div class="hero">
    <div class="hi">안녕하세요, 선생님 🐾</div>
    <h2>댕댕이 유치원</h2>
    <span class="tag">반려견 맞춤형 훈련소 &amp; 유치원</span>
    <div class="mascot">${mascot}</div>
  </div>
  <div class="body">
    <div class="count">
      <div class="num">3</div>
      <div class="lab"><b>오늘 등원 예정</b>2마리 등원 완료<div class="bar"><i></i></div></div>
    </div>
    <h3>현재 등원한 강아지 <span>${present.length}</span></h3>
    ${present.map(d => `
      <div class="card">
        <div class="dog"><div class="av">${d.e}</div><div><b>${d.n}</b><small>${d.b} · ${d.t}</small></div></div>
        <div class="row"><button class="btn sub">✏️ 알림장 작성</button><button class="btn go">하원 🏠</button></div>
      </div>`).join('')}
    <h3>등원 대기 <span>${wait.length}</span></h3>
    ${wait.map(d => `
      <div class="card"><div class="dog"><div class="av">${d.e}</div><div class="grow"><b>${d.n}</b><small>${d.b}</small></div><button class="btn go small">등원</button></div></div>`).join('')}
  </div>
  <div class="tabs"><div class="on"><i>🏠</i>홈</div><div><i>📒</i>알림장</div><div><i>📢</i>공지</div><div><i>🐕</i>강아지</div></div>`;

const designs = [
  {c:'t1', t:'1. 딸기우유', s:'간판의 코랄 핑크 → 복숭아 그라데이션', m:'🐶'},
  {c:'t2', t:'2. 새싹 초원', s:'간판의 연두 잔디 → 레몬 그라데이션', m:'🌳'},
  {c:'t3', t:'3. 노을 복숭아', s:'노랑 → 주황 → 분홍 따뜻한 그라데이션', m:'🐕'},
  {c:'t4', t:'4. 몽글 라벤더', s:'보라 → 분홍 몽환적인 그라데이션', m:'🐩'},
  {c:'t5', t:'5. 하늘 구름', s:'하늘색 → 민트 시원한 그라데이션', m:'🐾'},
];
document.getElementById('grid').innerHTML = designs.map(d =>
  `<figure><div class="phone ${d.c}">${screen(d.m)}</div><figcaption>${d.t}<small>${d.s}</small></figcaption></figure>`).join('');

// 라이트/다크 전환 (처음에는 기기 설정을 따라감)
const setMode = m => {
  document.body.dataset.theme = m;
  document.querySelectorAll('#toggle button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
};
document.querySelectorAll('#toggle button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
setMode(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</body>
</html>
