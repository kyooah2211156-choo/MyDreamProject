<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>댕답개 배우개 - 아이콘 시안 6개</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:linear-gradient(180deg,#f7f1ff,#ecdfff);color:#3e2a5c;padding:36px 16px 64px}
  header{text-align:center;max-width:800px;margin:0 auto 32px}
  header h1{font-size:32px;font-weight:900}
  header p{margin-top:8px;color:#8c79a8}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;max-width:960px;margin:0 auto}
  .card{background:#fff;border-radius:28px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 24px rgba(150,110,230,.2)}
  .big{width:180px;height:180px;margin:0 auto;border-radius:22.37%;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.22)}
  .big svg,.sm svg{display:block;width:100%;height:100%}
  .sizes{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-top:18px;padding:14px;border-radius:20px;background:linear-gradient(135deg,#8fb8ff,#c7a6ff)}
  .sizes .sm{border-radius:22.37%;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .sizes figure{color:#fff;font-size:10px;font-weight:700}
  .sizes figure .sm{margin:0 auto 4px}
  .s60{width:60px;height:60px}.s40{width:40px;height:40px}
  h2{margin-top:16px;font-size:17px;font-weight:900}
  .card p{font-size:12px;color:#8c79a8;margin-top:3px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 발바닥 -->
    <symbol id="paw" viewBox="0 0 100 100">
      <ellipse cx="20" cy="46" rx="9" ry="12"/><ellipse cx="38" cy="25" rx="9.5" ry="13"/>
      <ellipse cx="62" cy="25" rx="9.5" ry="13"/><ellipse cx="80" cy="46" rx="9" ry="12"/>
      <path d="M50 44c-15 0-28 13-28 26 0 9 7 13 14 13 5 0 9-2 14-2s9 2 14 2c7 0 14-4 14-13 0-13-13-26-28-26z"/>
    </symbol>
    <!-- 강아지 얼굴 -->
    <symbol id="dog" viewBox="0 0 100 100">
      <ellipse cx="20" cy="42" rx="13" ry="22" transform="rotate(18 20 42)" fill="var(--ear,#c98a5b)"/>
      <ellipse cx="80" cy="42" rx="13" ry="22" transform="rotate(-18 80 42)" fill="var(--ear,#c98a5b)"/>
      <ellipse cx="50" cy="55" rx="33" ry="30" fill="var(--face,#fff3e4)"/>
      <ellipse cx="38" cy="50" rx="4.5" ry="5.5" fill="#4a2418"/><ellipse cx="62" cy="50" rx="4.5" ry="5.5" fill="#4a2418"/>
      <circle cx="39.5" cy="48" r="1.5" fill="#fff"/><circle cx="63.5" cy="48" r="1.5" fill="#fff"/>
      <ellipse cx="50" cy="63" rx="6" ry="4.5" fill="#4a2418"/>
      <path d="M50 67v4M50 71c-3 4-8 4-10 1M50 71c3 4 8 4 10 1" stroke="#4a2418" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="28" cy="62" rx="5" ry="3.2" fill="#ffb3b3" opacity=".7"/><ellipse cx="72" cy="62" rx="5" ry="3.2" fill="#ffb3b3" opacity=".7"/>
    </symbol>
  </defs>
</svg>

<header>
  <h1>🐾 댕답개 배우개 아이콘 시안</h1>
  <p>아이콘 6개입니다. 아래 보라색 박스에서 아이폰 홈 화면에서 보이는 작은 크기도 확인할 수 있어요.</p>
</header>

<main class="grid" id="grid"></main>

<script>
const icons = [
 { t:'1. 몽글 발바닥', s:'앱 색(라벤더) 그라데이션 + 하얀 발바닥',
   svg:`<svg viewBox="0 0 100 100"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a77bff"/><stop offset=".55" stop-color="#c58bff"/><stop offset="1" stop-color="#ff9ad0"/></linearGradient></defs>
   <rect width="100" height="100" fill="url(#g1)"/><circle cx="85" cy="12" r="26" fill="#fff" opacity=".15"/><circle cx="10" cy="95" r="22" fill="#fff" opacity=".12"/>
   <g fill="#fff" transform="translate(21 20) scale(.58)" style="filter:drop-shadow(0 3px 0 rgba(90,50,170,.35))"><use href="#paw" width="100" height="100"/></g>
   <path d="M78 76c-4-5-12-1-8 5l8 8 8-8c4-6-4-10-8-5z" fill="#fff" opacity=".9" transform="translate(-4 -22) scale(.8)"/></svg>` },

 { t:'2. 방긋 강아지', s:'코랄 핑크 바탕 + 웃는 강아지 얼굴',
   svg:`<svg viewBox="0 0 100 100"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a7a"/><stop offset=".6" stop-color="#ffa27a"/><stop offset="1" stop-color="#ffc58a"/></linearGradient></defs>
   <rect width="100" height="100" fill="url(#g2)"/><circle cx="18" cy="14" r="22" fill="#fff" opacity=".16"/>
   <g transform="translate(8 10) scale(.84)"><use href="#dog" width="100" height="100"/></g></svg>` },

 { t:'3. 나무 언덕', s:'간판의 나무·잔디·하트 느낌',
   svg:`<svg viewBox="0 0 100 100"><defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4ef"/><stop offset="1" stop-color="#ffe3df"/></linearGradient>
   <linearGradient id="g3b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf2c"/><stop offset="1" stop-color="#b8e05a"/></linearGradient></defs>
   <rect width="100" height="100" fill="url(#g3)"/>
   <path d="M-5 82c20-16 40-16 55-6 20 12 35 4 55-4v38H-5z" fill="url(#g3b)"/>
   <path d="M47 82c1-14 0-22-2-30h10c-2 8-1 16 0 30z" fill="#8a5130"/>
   <circle cx="50" cy="36" r="20" fill="url(#g3b)"/><circle cx="36" cy="44" r="13" fill="#7dc735"/><circle cx="64" cy="44" r="13" fill="#8fd23f"/>
   <path d="M20 22c-5-6-14-1-9 6l9 8 9-8c5-7-4-12-9-6z" fill="#ff7a7a"/><path d="M80 20c-4-5-11-1-7 5l7 7 7-7c4-6-3-10-7-5z" fill="#ff7a7a" opacity=".85"/>
   <g fill="#fff"><circle cx="22" cy="88" r="3"/><circle cx="76" cy="90" r="3"/></g><g fill="#ffb81c"><circle cx="22" cy="88" r="1.2"/><circle cx="76" cy="90" r="1.2"/></g></svg>` },

 { t:'4. 알림장 발바닥', s:'알림장 노트 + 발바닥 도장',
   svg:`<svg viewBox="0 0 100 100"><defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a6cf5"/><stop offset="1" stop-color="#ff8cc6"/></linearGradient></defs>
   <rect width="100" height="100" fill="url(#g4)"/>
   <rect x="25" y="16" width="52" height="68" rx="9" fill="#fff" transform="rotate(6 50 50)" style="filter:drop-shadow(0 4px 0 rgba(80,40,160,.3))"/>
   <g stroke="#e6d9fb" stroke-width="3" stroke-linecap="round" transform="rotate(6 50 50)"><path d="M34 70h32M34 62h24"/></g>
   <g fill="#ff8cc6" transform="translate(33 24) scale(.34) rotate(6 50 50)"><use href="#paw" width="100" height="100"/></g>
   <g transform="rotate(40 76 70)"><rect x="72" y="52" width="8" height="30" rx="3" fill="#ffd36a"/><path d="M72 82l4 8 4-8z" fill="#4a2418"/></g></svg>` },

 { t:'5. 학사모 강아지', s:'"배우개"의 느낌, 공부하는 강아지',
   svg:`<svg viewBox="0 0 100 100"><defs><linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#ff8a65"/><stop offset="1" stop-color="#ff6f91"/></linearGradient></defs>
   <rect width="100" height="100" fill="url(#g5)"/><circle cx="85" cy="85" r="26" fill="#fff" opacity=".14"/>
   <g transform="translate(10 16) scale(.8)"><use href="#dog" width="100" height="100"/></g>
   <g transform="translate(0 -2)"><path d="M50 12 18 26l32 14 32-14z" fill="#3e2a5c"/><path d="M34 33v10c0 5 32 5 32 0V33l-16 7z" fill="#53397a"/>
   <path d="M82 26v16" stroke="#ffd36a" stroke-width="2.5" stroke-linecap="round"/><circle cx="82" cy="45" r="3.5" fill="#ffd36a"/></g></svg>` },

 { t:'6. 간판 글자', s:'간판처럼 갈색 "댕" 글자 + 코랄 발바닥',
   svg:`<svg viewBox="0 0 100 100"><defs><linearGradient id="g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#ffe9e4"/></linearGradient></defs>
   <rect width="100" height="100" fill="url(#g6)"/>
   <rect x="5" y="5" width="90" height="90" rx="26" fill="none" stroke="#b87333" stroke-width="3"/>
   <text x="50" y="66" text-anchor="middle" font-size="58" font-weight="900" fill="#4a2418" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">댕</text>
   <g fill="#ff7a7a" transform="translate(63 62) scale(.3)"><use href="#paw" width="100" height="100"/></g>
   <g stroke="#ffb81c" stroke-width="3" stroke-linecap="round"><path d="M16 22l7 4M14 32h8M84 22l-7 4"/></g></svg>` },
];

document.getElementById('grid').innerHTML = icons.map(i => `
  <div class="card">
    <div class="big">${i.svg}</div>
    <h2>${i.t}</h2><p>${i.s}</p>
    <div class="sizes">
      <figure><div class="sm s60">${i.svg.replace(/id="(g\d+b?)"/g,'id="$1x"').replace(/url\(#(g\d+b?)\)/g,'url(#$1x)')}</div>홈 화면</figure>
      <figure><div class="sm s40">${i.svg.replace(/id="(g\d+b?)"/g,'id="$1y"').replace(/url\(#(g\d+b?)\)/g,'url(#$1y)')}</div>설정</figure>
    </div>
  </div>`).join('');
</script>
</body>
</html>
